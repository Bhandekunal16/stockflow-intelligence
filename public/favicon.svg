<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded squircle background with fintech indigo gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="12" y1="50" x2="52" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="glow" x="0" y="0" width="64" height="64" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#10b981" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Grid lines (subtle) -->
  <line x1="14" y1="24" x2="50" y2="24" stroke="#ffffff" stroke-opacity="0.08" stroke-dasharray="2 2" stroke-width="1" />
  <line x1="14" y1="36" x2="50" y2="36" stroke="#ffffff" stroke-opacity="0.08" stroke-dasharray="2 2" stroke-width="1" />
  <line x1="14" y1="48" x2="50" y2="48" stroke="#ffffff" stroke-opacity="0.08" stroke-dasharray="2 2" stroke-width="1" />

  <!-- Candlestick / Bar Accents in background -->
  <rect x="18" y="32" width="4" height="14" rx="1.5" fill="#6366f1" fill-opacity="0.35" />
  <rect x="28" y="26" width="4" height="20" rx="1.5" fill="#6366f1" fill-opacity="0.35" />
  <rect x="38" y="18" width="4" height="28" rx="1.5" fill="#6366f1" fill-opacity="0.35" />

  <!-- Upward Trend Area fill -->
  <path d="M 14 44 L 24 38 L 34 30 L 44 20 L 50 16 L 50 48 L 14 48 Z" fill="#10b981" fill-opacity="0.12" />

  <!-- Upward Growth Line with Glow -->
  <path d="M 14 44 L 24 38 L 34 30 L 44 20 L 50 16" stroke="url(#lineGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Arrow Head -->
  <path d="M 42 16 L 50 16 L 50 24" stroke="url(#lineGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Indicator Point -->
  <circle cx="50" cy="16" r="3" fill="#ffffff" />
</svg>
